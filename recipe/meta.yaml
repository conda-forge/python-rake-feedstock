{% set name = "python-rake" %}
{% set version = "1.5.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/python-rake-{{ version }}.tar.gz
  sha256: 7165a713208890de0bdfc2da8eb4269336114985135be10cb8d752ba9fc3fbd4

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - python >={{ python_min }}

test:
  imports:
    - RAKE
    - RAKE.stoplists
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/fabianvf/python-rake
  summary: A python module implementing the Rapid Automatic Keyword Extraction algorithm.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - FernandezMathieu
